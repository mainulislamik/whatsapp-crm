services:
  searxng:
    image: searxng/searxng:latest
    container_name: wa-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=crm-search

  whatsapp-engine:
    build: ./whatsapp-engine
    container_name: wa-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WA_PORT:-5001}:5001"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./wa_auth_data:/app/auth_info_baileys
      - ./wa_media_data:/app/media
      - ./whatsapp-engine/server.js:/app/server.js

  backend:
    build: ./backend
    container_name: wa-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8050}:8000"
    environment:
      - WHATSAPP_ENGINE_URL=http://whatsapp-engine:5001
      - SEARXNG_URL=http://searxng:8080
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-stockwhisk}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-imontouhid4992}
      - DEBUG=True
      - OMNIROUTE_URL=http://172.20.0.1:20128/v1
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - STOCKWHISK_DB_URL=postgresql://stockwhisk:stockwhisk_password@stockwhisk_updated-db-1:5432/stockwhisk
    volumes:
      - ./wa_backend_data:/app/data
      - ./wa_media_data:/app/media
      - ./backend:/app
    depends_on: [whatsapp-engine, searxng]
    networks:
      - default
      - stockwhisk_net

  frontend:
    build: ./frontend
    container_name: wa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3050}:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on: [backend]

networks:
  default:
  stockwhisk_net:
    external: true
    name: stockwhisk_updated_default
